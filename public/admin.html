<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — Tempore</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/js/nav.js"></script>
  <style>
    .admin-wrap { max-width: 1200px; margin: 40px auto; padding: 0 20px; animation: fadeIn 0.6s ease-out; }
    .admin-title { font-size: 28px; color: #3E2723; margin-bottom: 25px; }
    
    /* Статистика */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .stat-box { 
      background: #FAF4E8; padding: 20px; border-radius: 12px; text-align: center; 
      border: 1px solid rgba(160,112,74,0.15); transition: transform 0.3s, box-shadow 0.3s;
      animation: slideUp 0.5s ease-out backwards;
    }
    .stat-box:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(160,112,74,0.15); }
    .stat-box .num { font-size: 32px; font-weight: 700; color: #A0704A; }
    .stat-box .lbl { font-size: 12px; color: #8D7B6D; text-transform: uppercase; letter-spacing: 1px; }

    /* Вкладки */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { 
      padding: 10px 20px; border: none; background: #E8DCC4; color: #3E2723; 
      border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.25s; font-size: 14px;
    }
    .tab-btn:hover { background: #D9C8A8; }
    .tab-btn.active { background: #A0704A; color: #fff; box-shadow: 0 4px 15px rgba(160,112,74,0.3); }

    /* Обертка для таблиц (стиль сайта) */
    .table-container {
      background: #FAF4E8;
      border-radius: 12px;
      border: 1px solid rgba(160,112,74,0.15);
      box-shadow: 0 8px 30px rgba(62,39,35,0.08);
      overflow: hidden;
      animation: fadeIn 0.4s ease-out;
      margin-top: 15px;
    }
    
    .content-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .content-table th { 
      background: #F5EBD8; color: #3E2723; font-weight: 600; text-align: left; 
      padding: 15px; border-bottom: 2px solid rgba(160,112,74,0.15); white-space: nowrap;
    }
    .content-table td { 
      padding: 14px 15px; border-bottom: 1px solid rgba(160,112,74,0.08); color: #5D4037;
      transition: background 0.2s;
    }
    .content-table tr:hover td { background: rgba(212,165,116,0.08); }
    .content-table tr:last-child td { border-bottom: none; }

    /* Селектор таблиц */
    .db-controls { display: flex; gap: 15px; align-items: center; background: #FAF4E8; padding: 15px 20px; border-radius: 10px; border: 1px solid rgba(160,112,74,0.15); margin-bottom: 15px; }
    .db-controls label { font-weight: 600; color: #3E2723; font-size: 15px; }
    .db-select { 
      padding: 10px 15px; border-radius: 8px; border: 2px solid #D9C8A8; 
      background: #F5EBD8; color: #3E2723; font-size: 14px; font-weight: 500;
      cursor: pointer; outline: none; transition: border 0.3s;
    }
    .db-select:focus { border-color: #A0704A; }

    /* Модалки */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .modal-box { background: #FAF4E8; width: 90%; max-width: 500px; border-radius: 12px; padding: 25px; color: #3E2723; box-shadow: 0 25px 70px rgba(0,0,0,0.4); }
    .modal-box h3 { margin-top: 0; margin-bottom: 20px; font-size: 20px; }
    .btn-close { width: 100%; padding: 12px; background: #3E2723; color: #fff; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; font-weight: 600; transition: background 0.3s; }
    .btn-close:hover { background: #5D4037; }

    /* Тёмная тема */
    body[data-theme="dark"] .stat-box, body[data-theme="dark"] .table-container, body[data-theme="dark"] .db-controls { background: #1F1815; border-color: rgba(212,165,116,0.15); }
    body[data-theme="dark"] .content-table th { background: #14100E; color: #F0E4D2; border-bottom-color: rgba(212,165,116,0.15); }
    body[data-theme="dark"] .content-table td { color: #C9B8A8; border-bottom-color: rgba(212,165,116,0.08); }
    body[data-theme="dark"] .content-table tr:hover td { background: rgba(212,165,116,0.05); }
    body[data-theme="dark"] .db-controls label { color: #F0E4D2; }
    body[data-theme="dark"] .db-select { background: #14100E; color: #E8DCC4; border-color: #3A2E24; }
    body[data-theme="dark"] .modal-box { background: #1F1815; color: #E8DCC4; }
  </style>
</head>
<body>

  <div class="admin-wrap">
    <h1 class="admin-title">👑 Админ-панель Tempore</h1>
    
    <div class="stats-grid">
      <div class="stat-box" style="animation-delay: 0.1s"><div class="num" id="statClients">...</div><div class="lbl">Клиентов</div></div>
      <div class="stat-box" style="animation-delay: 0.2s"><div class="num" id="statCouriers">...</div><div class="lbl">Курьеров</div></div>
      <div class="stat-box" style="animation-delay: 0.3s"><div class="num" id="statOrders">...</div><div class="lbl">Заказов</div></div>
      <div class="stat-box" style="animation-delay: 0.4s"><div class="num" id="statRevenue">...</div><div class="lbl">Выручка (₽)</div></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('orders', event)">Заказы</button>
      <button class="tab-btn" onclick="showTab('couriers', event)">Курьеры</button>
      <button class="tab-btn" onclick="showTab('db', event)">🗄️ Таблицы БД</button>
    </div>

    <div id="tab-orders" class="table-container">
      <table class="content-table">
        <thead><tr><th>ID</th><th>Клиент</th><th>Курьер</th><th>Маршрут</th><th>Цена</th><th>Статус</th><th>Действие</th></tr></thead>
        <tbody id="ordersBody"><tr><td colspan="7">Загрузка...</td></tr></tbody>
      </table>
    </div>

    <div id="tab-couriers" class="table-container hidden" style="display:none;">
      <table class="content-table">
        <thead><tr><th>ID</th><th>ФИО</th><th>Транспорт</th><th>Статус</th></tr></thead>
        <tbody id="couriersBody"><tr><td colspan="4">Загрузка...</td></tr></tbody>
      </table>
    </div>

    <div id="tab-db" style="display:none;">
      <div class="db-controls">
        <label>Выберите таблицу:</label>
        <select id="tableSelector" class="db-select" onchange="loadTableData()">
          <option value="clients">Клиенты</option>
          <option value="couriers">Курьеры</option>
          <option value="orders">Заказы</option>
          <option value="deliveries">Доставки</option>
          <option value="payments">Оплаты</option>
          <option value="reviews">Отзывы</option>
          <option value="messages">Сообщения</option>
        </select>
      </div>
      <div class="table-container" style="overflow-x: auto;">
        <table class="content-table" id="dbTable">
          <thead id="dbTableHead"></thead>
          <tbody id="dbTableBody"><tr><td>Выберите таблицу...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА ЧАТА -->
  <div class="modal-overlay" id="chatModal">
    <div class="modal-box">
      <h3>История чата по заказу</h3>
      <div id="chatHistory" style="max-height:400px; overflow-y:auto; background:#F5EBD8; padding:15px; border-radius:8px;"></div>
      <button class="btn-close" onclick="document.getElementById('chatModal').style.display='none'">Закрыть</button>
    </div>
  </div>

  <!-- МОДАЛКА ИНФО -->
  <div class="modal-overlay" id="infoModal">
    <div class="modal-box">
      <h3>Информация о клиенте</h3>
      <div id="infoContent"></div>
      <button class="btn-close" onclick="document.getElementById('infoModal').style.display='none'">Закрыть</button>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');

    if (!token || user.email !== 'admin@tempore.ru') {
      alert('Доступ только для администратора!');
      window.location.href = '/index.html';
    }

    async function loadStats() {
      const r = await fetch('/api/admin/stats', { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await r.json();
      if (data.success) {
        document.getElementById('statClients').textContent = data.stats.clients;
        document.getElementById('statCouriers').textContent = data.stats.couriers;
        document.getElementById('statOrders').textContent = data.stats.orders;
        document.getElementById('statRevenue').textContent = data.stats.revenue;
      }
    }

    async function loadOrders() {
      const tbody = document.getElementById('ordersBody');
      const r = await fetch('/api/admin/orders', { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await r.json();
      if (data.success) {
        if (data.orders.length === 0) { tbody.innerHTML = '<tr><td colspan="7">Нет заказов</td></tr>'; return; }
        tbody.innerHTML = data.orders.map(o => `
          <tr>
            <td>#${o.order_id}</td>
            <td>${o.client_name || '—'}</td>
            <td>${o.courier_name || '—'}</td>
            <td>${o.from_address} → ${o.to_address}</td>
            <td>${o.delivery_price} ₽</td>
            <td><span style="padding:3px 8px; background:rgba(160,112,74,0.15); border-radius:4px; font-size:12px;">${o.status}</span></td>
            <td>
              <button onclick="openChat(${o.order_id})" style="padding:5px 10px; cursor:pointer; background:#4A6B9C; color:#fff; border:none; border-radius:4px; margin-right:5px; font-size:12px;">💬 Чат</button>
              <button onclick="openInfo(${o.client_id})" style="padding:5px 10px; cursor:pointer; background:#A0704A; color:#fff; border:none; border-radius:4px; font-size:12px;">ℹ️ Инфо</button>
            </td>
          </tr>
        `).join('');
      }
    }

    async function loadCouriers() {
      const tbody = document.getElementById('couriersBody');
      const r = await fetch('/api/admin/couriers', { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await r.json();
      if (data.success) {
        if (data.couriers.length === 0) { tbody.innerHTML = '<tr><td colspan="4">Нет курьеров</td></tr>'; return; }
        tbody.innerHTML = data.couriers.map(c => `
          <tr>
            <td>#${c.courier_id}</td>
            <td>${c.full_name}</td>
            <td>${c.transport}</td>
            <td><span style="padding:3px 8px; background:rgba(125,165,45,0.15); border-radius:4px; font-size:12px;">${c.work_status}</span></td>
          </tr>
        `).join('');
      }
    }

    async function loadTableData() {
      const tableName = document.getElementById('tableSelector').value;
      const thead = document.getElementById('dbTableHead');
      const tbody = document.getElementById('dbTableBody');
      
      tbody.innerHTML = '<tr><td style="text-align:center; padding:20px;">Загрузка данных...</td></tr>';
      thead.innerHTML = '';
      
      try {
        const r = await fetch('/api/admin/table/' + tableName, { headers: { 'Authorization': 'Bearer ' + token } });
        const data = await r.json();
        
        if (data.success) {
          thead.innerHTML = '<tr>' + data.columns.map(col => `<th>${col}</th>`).join('') + '</tr>';
          
          if (data.rows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="' + data.columns.length + '" style="text-align:center; padding:20px;">Таблица пуста</td></tr>';
          } else {
            tbody.innerHTML = data.rows.map(row => {
              return '<tr>' + data.columns.map(col => {
                let val = row[col];
                if (val === null) val = '—';
                if (typeof val === 'object') val = JSON.stringify(val);
                if (typeof val === 'string' && val.length > 50) val = val.substring(0, 50) + '...';
                return `<td>${val}</td>`;
              }).join('') + '</tr>';
            }).join('');
          }
        } else {
          tbody.innerHTML = '<tr><td style="text-align:center; padding:20px;">Ошибка загрузки</td></tr>';
        }
      } catch (e) {
        tbody.innerHTML = '<tr><td style="text-align:center; padding:20px;">Ошибка соединения</td></tr>';
      }
    }

    function showTab(tab, event) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      
      document.getElementById('tab-orders').style.display = 'none';
      document.getElementById('tab-couriers').style.display = 'none';
      document.getElementById('tab-db').style.display = 'none';
      
      if (tab === 'orders') document.getElementById('tab-orders').style.display = 'block';
      if (tab === 'couriers') document.getElementById('tab-couriers').style.display = 'block';
      if (tab === 'db') {
        document.getElementById('tab-db').style.display = 'block';
        loadTableData(); // Автоматически загружаем данные при открытии вкладки
      }
    }

    async function openChat(orderId) {
      document.getElementById('chatModal').style.display = 'flex';
      const container = document.getElementById('chatHistory');
      container.innerHTML = 'Загрузка...';
      const r = await fetch('/api/admin/chat/' + orderId, { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await r.json();
      if (data.success && data.messages.length > 0) {
        container.innerHTML = data.messages.map(m => `
          <div style="margin-bottom:10px; text-align:${m.sender_role === 'client' ? 'left' : 'right'};">
            <div style="display:inline-block; padding:8px 12px; border-radius:10px; background:${m.sender_role === 'client' ? '#FAF4E8' : '#A0704A'}; color:${m.sender_role === 'client' ? '#3E2723' : '#fff'};">
              <b>${m.sender_role === 'client' ? 'Клиент' : 'Курьер'}:</b> ${m.text}
            </div>
          </div>
        `).join('');
      } else {
        container.innerHTML = 'Сообщений нет.';
      }
    }

    async function openInfo(clientId) {
      document.getElementById('infoModal').style.display = 'flex';
      document.getElementById('infoContent').innerHTML = 'Загрузка...';
      const r = await fetch('/api/admin/clients/' + clientId, { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await r.json();
      if (data.success) {
        const c = data.client;
        document.getElementById('infoContent').innerHTML = `
          <p><b>ФИО:</b> ${c.full_name}</p>
          <p><b>Телефон:</b> ${c.phone}</p>
          <p><b>Email:</b> ${c.email}</p>
          <p><b>Город:</b> ${c.city || '—'}</p>
          <p><b>Адрес:</b> ${c.address || '—'}</p>
        `;
      } else {
        document.getElementById('infoContent').innerHTML = 'Ошибка загрузки';
      }
    }

    loadStats();
    loadOrders();
    loadCouriers();
  </script>
</body>
</html>
