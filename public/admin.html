<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — Tempore</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/js/nav.js"></script>
  <style>
    .admin-wrap { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .admin-title { font-size: 28px; color: #3E2723; margin-bottom: 25px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .stat-box { background: #FAF4E8; padding: 20px; border-radius: 10px; text-align: center; border: 1px solid rgba(160,112,74,0.15); }
    .stat-box .num { font-size: 32px; font-weight: 700; color: #A0704A; }
    .stat-box .lbl { font-size: 12px; color: #8D7B6D; text-transform: uppercase; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 10px 20px; border: none; background: #E8DCC4; color: #3E2723; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .tab-btn.active { background: #A0704A; color: #fff; }
    .content-table { width: 100%; background: #FAF4E8; border-radius: 10px; border-collapse: collapse; overflow: hidden; }
    .content-table th, .content-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid rgba(160,112,74,0.1); font-size: 14px; }
    .content-table th { background: #F5EBD8; color: #3E2723; font-weight: 600; }
    .content-table tr:hover { background: rgba(160,112,74,0.05); }
    .hidden { display: none; }
    body[data-theme="dark"] .stat-box, body[data-theme="dark"] .content-table { background: #1F1815; color: #E8DCC4; }
    body[data-theme="dark"] .content-table th { background: #14100E; color: #F0E4D2; }
    
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
    .modal-box { background: #FAF4E8; width: 90%; max-width: 500px; border-radius: 10px; padding: 20px; color: #3E2723; }
    .modal-box h3 { margin-top: 0; }
    .btn-close { width: 100%; padding: 10px; background: #3E2723; color: #fff; border: none; border-radius: 6px; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="admin-wrap">
    <h1 class="admin-title">👑 Админ-панель Tempore</h1>
    
    <div class="stats-grid">
      <div class="stat-box"><div class="num" id="statClients">...</div><div class="lbl">Клиентов</div></div>
      <div class="stat-box"><div class="num" id="statCouriers">...</div><div class="lbl">Курьеров</div></div>
      <div class="stat-box"><div class="num" id="statOrders">...</div><div class="lbl">Заказов</div></div>
      <div class="stat-box"><div class="num" id="statRevenue">...</div><div class="lbl">Выручка (₽)</div></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('orders', event)">Заказы</button>
      <button class="tab-btn" onclick="showTab('couriers', event)">Курьеры</button>
    </div>

    <div id="tab-orders">
      <table class="content-table">
        <thead><tr><th>ID</th><th>Клиент</th><th>Курьер</th><th>Маршрут</th><th>Цена</th><th>Статус</th><th>Действие</th></tr></thead>
        <tbody id="ordersBody"><tr><td colspan="7">Загрузка...</td></tr></tbody>
      </table>
    </div>

    <div id="tab-couriers" class="hidden">
      <table class="content-table">
        <thead><tr><th>ID</th><th>ФИО</th><th>Транспорт</th><th>Статус</th><th>Действие</th></tr></thead>
        <tbody id="couriersBody"><tr><td colspan="5">Загрузка...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- МОДАЛКА ЧАТА -->
  <div class="modal-overlay" id="chatModal">
    <div class="modal-box">
      <h3>История чата по заказу</h3>
      <div id="chatHistory" style="max-height:400px; overflow-y:auto; background:#F5EBD8; padding:15px; border-radius:8px;"></div>
      <button class="btn-close" onclick="document.getElementById('chatModal').style.display='none'">Закрыть</button>
    </div>
  </div>

  <!-- МОДАЛКА ИНФО -->
  <div class="modal-overlay" id="infoModal">
    <div class="modal-box">
      <h3>Информация</h3>
      <div id="infoContent"></div>
      <button class="btn-close" onclick="document.getElementById('infoModal').style.display='none'">Закрыть</button>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');

    if (!token || user.email !== 'admin@tempore.ru') {
      alert('Доступ только для администратора!');
      window.location.href = '/index.html';
    }

    async function loadStats() {
      const r = await fetch('/api/admin/stats', { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await r.json();
      if (data.success) {
        document.getElementById('statClients').textContent = data.stats.clients;
        document.getElementById('statCouriers').textContent = data.stats.couriers;
        document.getElementById('statOrders').textContent = data.stats.orders;
        document.getElementById('statRevenue').textContent = data.stats.revenue;
      }
    }

    async function loadOrders() {
      const tbody = document.getElementById('ordersBody');
      const r = await fetch('/api/admin/orders', { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await r.json();
      if (data.success) {
        tbody.innerHTML = data.orders.map(o => `
          <tr>
            <td>#${o.order_id}</td>
            <td>${o.client_name || '—'}</td>
            <td>${o.courier_name || '—'}</td>
            <td>${o.from_address} → ${o.to_address}</td>
            <td>${o.delivery_price} ₽</td>
            <td>${o.status}</td>
            <td>
              <button onclick="openChat(${o.order_id})" style="padding:5px 10px; cursor:pointer; background:#4A6B9C; color:#fff; border:none; border-radius:4px; margin-right:5px;">💬 Чат</button>
              <button onclick="openClientInfo(${o.order_id})" style="padding:5px 10px; cursor:pointer; background:#A0704A; color:#fff; border:none; border-radius:4px;">ℹ️ Инфо</button>
            </td>
          </tr>
        `).join('');
      }
    }

    async function loadCouriers() {
      const tbody = document.getElementById('couriersBody');
      const r = await fetch('/api/admin/couriers', { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await r.json();
      if (data.success) {
        tbody.innerHTML = data.couriers.map(c => `
          <tr>
            <td>#${c.courier_id}</td>
            <td>${c.full_name}</td>
            <td>${c.transport}</td>
            <td>${c.work_status}</td>
            <td><button onclick="openCourierInfo(${c.courier_id})" style="padding:5px 10px; cursor:pointer; background:#A0704A; color:#fff; border:none; border-radius:4px;">ℹ️ Инфо</button></td>
          </tr>
        `).join('');
      }
    }

    function showTab(tab, event) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-orders').classList.add('hidden');
      document.getElementById('tab-couriers').classList.add('hidden');
      document.getElementById('tab-' + tab).classList.remove('hidden');
    }

    async function openChat(orderId) {
      document.getElementById('chatModal').style.display = 'flex';
      const container = document.getElementById('chatHistory');
      container.innerHTML = 'Загрузка...';
      const r = await fetch('/api/admin/chat/' + orderId, { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await r.json();
      if (data.success && data.messages.length > 0) {
        container.innerHTML = data.messages.map(m => `
          <div style="margin-bottom:10px; text-align:${m.sender_role === 'client' ? 'left' : 'right'};">
            <div style="display:inline-block; padding:8px 12px; border-radius:10px; background:${m.sender_role === 'client' ? '#FAF4E8' : '#A0704A'}; color:${m.sender_role === 'client' ? '#3E2723' : '#fff'};">
              <b>${m.sender_role === 'client' ? 'Клиент' : 'Курьер'}:</b> ${m.text}
            </div>
          </div>
        `).join('');
      } else {
        container.innerHTML = 'Сообщений нет.';
      }
    }

    async function openClientInfo(orderId) {
      // Для простоты берем инфу по заказу, чтобы найти клиента (или можно доработать)
      document.getElementById('infoModal').style.display = 'flex';
      document.getElementById('infoContent').innerHTML = 'Загрузка... (инфо клиента доступно в доработке)';
    }

    async function openCourierInfo(courierId) {
      document.getElementById('infoModal').style.display = 'flex';
      document.getElementById('infoContent').innerHTML = 'Загрузка... (инфо курьера доступно в доработке)';
    }

    loadStats();
    loadOrders();
    loadCouriers();
  </script>
</body>
</html>
