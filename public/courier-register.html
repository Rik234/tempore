<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="courier.become">Стать курьером — Tempore</title>
  <link rel="stylesheet" href="style.css">
  <script src="/js/nav.js"></script>
  <style>
    .auth-page {
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }
    .auth-page::before {
      content: '';
      position: absolute;
      top: -30%; right: -15%;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(212,165,116,0.12), transparent 60%);
      border-radius: 50%;
      animation: floatOrb 12s ease-in-out infinite;
    }
    .auth-page::after {
      content: '';
      position: absolute;
      bottom: -30%; left: -15%;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(160,112,74,0.1), transparent 60%);
      border-radius: 50%;
      animation: floatOrb 15s ease-in-out infinite reverse;
    }
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-40px) scale(1.08); }
    }

    .auth-card {
      position: relative;
      z-index: 2;
      max-width: 520px;
      width: 100%;
      background: #FAF4E8;
      padding: 45px 42px 40px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(62,39,35,0.12);
      border: 1px solid rgba(160,112,74,0.12);
      animation: cardEnter 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(30px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .auth-logo {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      color: #3E2723;
      letter-spacing: 5px;
      margin-bottom: 22px;
      transition: color 0.3s;
    }
    .auth-logo:hover { color: #A0704A; }

    .auth-title {
      text-align: center;
      color: #3E2723;
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 8px;
      letter-spacing: -0.3px;
    }
    .auth-subtitle {
      text-align: center;
      color: #8D7B6D;
      font-size: 14px;
      margin-bottom: 30px;
      font-weight: 300;
    }

    /* Фото */
    .photo-upload { text-align: center; margin-bottom: 25px; }
    .photo-preview {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: #F5EBD8;
      border: 2px dashed #A0704A;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      color: #A0704A;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.35s;
      margin-bottom: 10px;
      position: relative;
      opacity: 0.85;
    }
    .photo-preview:hover {
      border-style: solid;
      transform: scale(1.05);
      box-shadow: 0 12px 30px rgba(160,112,74,0.25);
      opacity: 1;
    }
    .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
    .photo-hint {
      font-size: 12px;
      color: #8D7B6D;
      display: block;
      font-weight: 300;
    }
    input[type="file"] { display: none; }

    /* Прогресс заполнения */
    .form-progress {
      height: 3px;
      background: rgba(160,112,74,0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 25px;
    }
    .form-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #A0704A, #D4A574);
      transition: width 0.4s ease-out;
      border-radius: 2px;
    }

    /* Поля */
    .input-wrapper { position: relative; margin-bottom: 16px; }
    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: #A0704A;
      pointer-events: none;
      transition: all 0.3s;
      opacity: 0.7;
    }
    .input-wrapper input {
      padding-left: 46px !important;
      height: 50px;
      background: #F5EBD8 !important;
      border: 1px solid #D9C8A8 !important;
      font-size: 14px;
      transition: all 0.3s;
    }
    .input-wrapper.focused .input-icon {
      color: #3E2723;
      opacity: 1;
      transform: translateY(-50%) scale(1.15);
    }
    .input-wrapper.focused input {
      border-color: #A0704A !important;
      background: #FFFFFF !important;
      box-shadow: 0 0 0 3px rgba(160,112,74,0.1);
    }

    /* Транспорт */
    .transport-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 22px;
    }
    .transport-option {
      padding: 14px 8px;
      border: 1px solid #D9C8A8;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      user-select: none;
      background: #F5EBD8;
      position: relative;
    }
    .transport-option:hover {
      border-color: #A0704A;
      transform: translateY(-2px);
    }
    .transport-option.selected {
      border-color: #A0704A;
      background: #FAF4E8;
      box-shadow: 0 4px 15px rgba(160,112,74,0.15);
    }
    .transport-option.selected::after {
      content: '✓';
      position: absolute;
      top: 5px; right: 7px;
      color: #A0704A;
      font-size: 12px;
      font-weight: bold;
      animation: scaleIn 0.3s;
    }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
    .transport-option input { display: none; }
    .transport-option .icon {
      font-size: 22px;
      display: block;
      margin-bottom: 5px;
      opacity: 0.85;
    }
    .transport-option .name {
      font-size: 11px;
      color: #3E2723;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .section-label {
      color: #5D4037;
      font-size: 13px;
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
      letter-spacing: 0.3px;
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background: #A0704A;
      color: #FAF4E8;
      border: 1px solid #A0704A;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 52px;
      font-family: inherit;
      letter-spacing: 0.5px;
    }
    .btn-submit:hover:not(:disabled) {
      background: #7A5030;
      border-color: #7A5030;
      box-shadow: 0 8px 25px rgba(160,112,74,0.3);
    }
    .btn-submit:disabled { background: #C9B8A0; border-color: #C9B8A0; cursor: not-allowed; }
    .btn-submit .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    .btn-submit:disabled .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .auth-divider {
      display: flex;
      align-items: center;
      margin: 25px 0 18px;
      color: #8D7B6D;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(160,112,74,0.15);
    }
    .auth-divider span { padding: 0 15px; }

    .quick-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .quick-link {
      padding: 12px;
      border: 1px solid rgba(160,112,74,0.2);
      border-radius: 6px;
      text-align: center;
      text-decoration: none;
      color: #A0704A;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.25s;
      background: transparent;
    }
    .quick-link:hover {
      background: #A0704A;
      color: #FAF4E8;
      border-color: #A0704A;
    }

    @media (max-width: 480px) {
      .auth-card { padding: 35px 25px 30px; }
      .auth-logo { font-size: 22px; letter-spacing: 4px; }
      .auth-title { font-size: 20px; }
      .transport-grid { grid-template-columns: repeat(2, 1fr); }
      .photo-preview { width: 110px; height: 110px; font-size: 36px; }
    }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">TEMPORE</div>
      <h1 class="auth-title" data-i18n="courier.become">Стать курьером</h1>
      <p class="auth-subtitle" data-i18n="courier.subtitle">Присоединяйтесь к команде — это займёт минуту</p>

      <div class="form-progress">
        <div class="form-progress-fill" id="progressFill"></div>
      </div>

      <form id="courierForm" enctype="multipart/form-data">

        <div class="photo-upload">
          <label for="photoInput" class="photo-preview" id="photoPreview">📷</label>
          <input type="file" id="photoInput" name="photo" accept="image/jpeg,image/png,image/webp">
          <span class="photo-hint" data-i18n="courier.photo_hint">Нажмите, чтобы загрузить фото</span>
        </div>

        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="full_name" placeholder="ФИО *" required data-i18n-placeholder="form.fullname" data-track>
        </div>
        <div class="input-wrapper">
          <span class="input-icon">📞</span>
          <input type="tel" id="phone" placeholder="Телефон *" required data-i18n-placeholder="form.phone" data-track>
        </div>
        <div class="input-wrapper">
          <span class="input-icon">✉</span>
          <input type="email" id="email" placeholder="Email *" required data-i18n-placeholder="form.email" data-track>
        </div>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" placeholder="Пароль *" required minlength="4" data-i18n-placeholder="form.password" data-track>
        </div>

        <label class="section-label" data-i18n="courier.transport">Вид транспорта *</label>
        <div class="transport-grid">
          <label class="transport-option selected" data-value="Пеший">
            <input type="radio" name="transport" value="Пеший" checked>
            <span class="icon">🚶</span>
            <span class="name" data-i18n="courier.transport_foot">Пеший</span>
          </label>
          <label class="transport-option" data-value="Велосипед">
            <input type="radio" name="transport" value="Велосипед">
            <span class="icon">🚴</span>
            <span class="name" data-i18n="courier.transport_bike">Вело</span>
          </label>
          <label class="transport-option" data-value="Автомобиль">
            <input type="radio" name="transport" value="Автомобиль">
            <span class="icon">🚗</span>
            <span class="name" data-i18n="courier.transport_car">Авто</span>
          </label>
          <label class="transport-option" data-value="Мотоцикл">
            <input type="radio" name="transport" value="Мотоцикл">
            <span class="icon">🏍</span>
            <span class="name" data-i18n="courier.transport_moto">Мото</span>
          </label>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="spinner"></span>
          <span id="btnText" data-i18n="courier.register_btn">Зарегистрироваться</span>
        </button>
      </form>

      <div class="message" id="message"></div>

      <div class="auth-divider"><span data-i18n="form.or">ИЛИ</span></div>

      <div class="quick-links">
        <a href="/login.html" class="quick-link" data-i18n="nav.login">Войти</a>
        <a href="/register.html" class="quick-link" data-i18n="courier.iam_client">Я клиент</a>
      </div>
    </div>
  </div>

  <script>
    const photoInput = document.getElementById('photoInput');
    const photoPreview = document.getElementById('photoPreview');

    document.querySelectorAll('.input-wrapper input').forEach(inp => {
      inp.addEventListener('focus', () => inp.parentElement.classList.add('focused'));
      inp.addEventListener('blur', () => inp.parentElement.classList.remove('focused'));
    });

    // Прогресс заполнения
    const trackedInputs = document.querySelectorAll('[data-track]');
    function updateProgress() {
      let filled = 0;
      trackedInputs.forEach(inp => { if (inp.value.trim() !== '') filled++; });
      const percent = (filled / trackedInputs.length) * 100;
      document.getElementById('progressFill').style.width = percent + '%';
    }
    trackedInputs.forEach(inp => inp.addEventListener('input', updateProgress));

    // Фото
    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        alert('Файл слишком большой. Максимум 5 МБ.');
        photoInput.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        photoPreview.innerHTML = '<img src="' + ev.target.result + '" alt="Фото">';
      };
      reader.readAsDataURL(file);
    });

    // Транспорт
    document.querySelectorAll('.transport-option').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.transport-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
      });
    });

    // Отправка
    document.getElementById('courierForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const message = document.getElementById('message');
      const form = document.getElementById('courierForm');

      const formData = new FormData();
      formData.append('full_name', document.getElementById('full_name').value);
      formData.append('phone', document.getElementById('phone').value);
      formData.append('email', document.getElementById('email').value);
      formData.append('password', document.getElementById('password').value);
      formData.append('transport', document.querySelector('input[name="transport"]:checked').value);

      const photoFile = photoInput.files[0];
      if (photoFile) formData.append('photo', photoFile);

      btn.disabled = true;
      btnText.textContent = '...';
      message.className = 'message';

      try {
        const response = await fetch('/api/auth/register-courier', {
          method: 'POST',
          body: formData
        });
        const result = await response.json();

        if (result.success) {
          message.className = 'message success';
          message.textContent = result.message + ' Перенаправление...';
          if (typeof launchConfetti === 'function') launchConfetti();

          document.getElementById('courierForm').reset();
          photoPreview.innerHTML = '📷';
          document.querySelectorAll('.transport-option').forEach(o => o.classList.remove('selected'));
          document.querySelector('.transport-option').classList.add('selected');
          document.getElementById('progressFill').style.width = '0%';

          setTimeout(() => window.location.href = '/login.html', 1800);
        } else {
          message.className = 'message error';
          message.textContent = result.message;
          form.classList.add('shake');
          setTimeout(() => form.classList.remove('shake'), 500);
          btn.disabled = false;
          btnText.textContent = window.t ? t('courier.register_btn') : 'Зарегистрироваться';
        }
      } catch (err) {
        message.className = 'message error';
        message.textContent = 'Ошибка соединения';
        btn.disabled = false;
        btnText.textContent = window.t ? t('courier.register_btn') : 'Зарегистрироваться';
      }
    });
  </script>

</body>
</html>
